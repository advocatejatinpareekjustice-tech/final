<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Advocate Jatin Pareek round seal logo</title>
  <desc id="desc">Navy and antique-gold circular legal monogram with JP initials.</desc>

  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .sans { font-family: Arial, Helvetica, sans-serif; }
  </style>

  <circle cx="256" cy="256" r="236" fill="#0B1F33" stroke="#C7A15A" stroke-width="12"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#C7A15A" stroke-width="3"/>
  <text x="256" y="82" class="sans" font-size="20" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#C7A15A">ADVOCATE</text>
  <text x="256" y="116" class="serif" font-size="24" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#FFFFFF">JATIN PAREEK</text>

